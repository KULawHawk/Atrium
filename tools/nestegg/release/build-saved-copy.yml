# Template for the PRIVATE saved-copies repository (Decision 30 A). Copy to .github/workflows/ THERE, never in Atrium
# (Atrium is public). It checks out Atrium's Nestegg tools, then saves one kind of file per job, one file at a time,
# into the release of the repository it runs in, using that repository's own GITHUB_TOKEN (no stored key).
name: build-saved-copy
on:
  workflow_dispatch:
    inputs:
      atrium_ref: {description: "Atrium commit or branch holding the pins", required: true, default: main}
      tag: {description: "release tag", required: true, default: saved-copy-v1}
permissions:
  contents: write
concurrency: {group: build-saved-copy, cancel-in-progress: false}
jobs:
  save:
    strategy:
      max-parallel: 1   # both jobs write the same INDEX.json; one at a time
      matrix: {kind: [packages, models]}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: {repository: KULawHawk/atrium, ref: "${{ inputs.atrium_ref }}", path: atrium}
      - name: Free disk (one file at a time, but the largest model file is ~5 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /
      - name: Save ${{ matrix.kind }}
        env: {GH_TOKEN: "${{ github.token }}"}
        run: python3 -I atrium/tools/nestegg/build_saved_release.py --repo "${{ github.repository }}" --tag "${{ inputs.tag }}" --kind ${{ matrix.kind }}
